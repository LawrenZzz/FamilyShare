name: familyshare
description: FamilyShare Flutter 客户端
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.1
  web_socket_channel: ^3.0.0
  shared_preferences: ^2.2.3
  permission_handler: ^11.3.1
  geolocator: ^12.0.0
  provider: ^6.1.2
  uuid: ^4.4.0
  liquid_glass_widgets: ^1.7.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
