plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}

def amapKey = project.findProperty('AMAP_KEY') ?: 'YOUR_AMAP_KEY_HERE'
def apiToken = project.findProperty('API_TOKEN') ?: 'mdi9a9083df9bnq97ssdbibbu7d98'
def releaseKeystore = file('familyshare-release.keystore')
def releasePasswordFile = rootProject.file('.release-pass-familyshare')
def releasePassword = releasePasswordFile.exists()
        ? releasePasswordFile.getText('UTF-8').trim()
        : ''

android {
    namespace 'com.familyshare.simonel'
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId 'com.familyshare.simonel'
        minSdkVersion flutter.minSdkVersion
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a' }
        manifestPlaceholders = [AMAP_KEY: amapKey]
        buildConfigField 'String', 'AMAP_KEY', "\"${amapKey}\""
        buildConfigField 'String', 'SERVER_URL', '"https://familyshare.lawlovesimone.site"'
        buildConfigField 'String', 'API_TOKEN', "\"${apiToken}\""
    }

    signingConfigs {
        familyshareRelease {
            storeFile releaseKeystore
            storePassword releasePassword
            keyAlias 'familyshare'
            keyPassword releasePassword
        }
    }

    // AMap bundles optional location implementations that are not present in
    // the lightweight SDK package. Keep release builds reliable until a
    // project-specific R8 keep configuration is added.
    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            if (releaseKeystore.exists() && !releasePassword.isEmpty()) {
                signingConfig signingConfigs.familyshareRelease
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures { buildConfig true }

    sourceSets {
        main {
            jniLibs.srcDirs = ['libs']
        }
    }
}

flutter { source '../..' }

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
