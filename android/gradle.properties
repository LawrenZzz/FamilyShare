# JVM 参数
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# ============ 项目配置（修改这里即可，无需改动代码） ============
# 高德开放平台申请的 Key（lbs.amap.com 控制台 -> 应用管理 -> 创建应用，服务平台选 Android）
# 注意：高德 Key 绑定的是「包名 + SHA1」，本工程包名（applicationId）已改为 com.familyshare.simonel，
#       申请 Key 时 PackageName 填 com.familyshare.simonel，安全码填下面的 SHA1。
AMAP_KEY=38f4a4b4fa52ad60abd5a934f3e8a688

# release 签名密码：与 android/app/release.keystore 的密码一致（别名 familyshare）。
# 由脚本生成后你会看到具体值，请妥善保存——以后每升级一版 APK 都要用它签名，丢了就再也无法发布更新。
RELEASE_KEYSTORE_PASSWORD=CHANGE_ME_RELEASE_PASSWORD

# 后端服务器地址（HTTPS/WSS 经 Nginx 443 反代到服务器 3000；WS 由 SERVER_URL 自动推导为 wss://...）
# 注意：不要带末尾斜杠
SERVER_URL=https://familyshare.lawlovesimone.site

# 访问口令：与服务器 application.properties 的 app.api-token 一致；/api/**、/ws、/icons/** 请求需携带
# 【必须】这个 token 必须 = NAS 上 server/.env 的 APP_API_TOKEN，两边一致 401 才会消失。
# 当前值 = NAS 上的 api_token（mdi9a9083df9bnq97ssdbibbu7d98）。若服务器 token 以后改动，这里要同步改。
API_TOKEN=YOUR_API_TOKEN_HERE
